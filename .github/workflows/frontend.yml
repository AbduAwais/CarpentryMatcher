name: Frontend CI
on:
    push:
        branches:
            - main
            - DEV
    pull_request:
        branches:
            - main
            - DEV
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./frontend/carpentrymatcherfrontend
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
                  cache-dependency-path: frontend/carpentrymatcherfrontend/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint
            - name: Type check
              run: npx tsc --noEmit
            - name: Build project
              run: npm run build
            